<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SaldoUP — comercial 2 (storyboard)</title>
<style>
@font-face { font-family: "InterV"; src: url("../video/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "InterV"; src: url("../video/fonts/inter-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
body { font-family: "InterV", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
#stage { position: relative; overflow: hidden; background: #05070a; color: #f2f4f7; }
.abs { position: absolute; will-change: transform, opacity, filter; }
.glow { border-radius: 50%; filter: blur(90px); mix-blend-mode: screen; }
.card { border-radius: 46px; overflow: hidden; box-shadow: 0 60px 140px -30px rgba(0,0,0,.95), 0 0 0 2px rgba(255,255,255,.1) inset; background: #111; }
.card .ph { position: absolute; left: 0; top: 0; background-size: 100% 100%; background-repeat: no-repeat; will-change: transform; transform-origin: 50% 0; }
.phone { border-radius: 92px; padding: 18px; background: linear-gradient(160deg, #2c333e, #0c1015 42%, #1c222b); box-shadow: 0 0 0 2px rgba(255,255,255,.1) inset, 0 80px 160px -40px rgba(0,0,0,.95); }
.phone::before { content: ""; position: absolute; top: 30px; left: 50%; width: 170px; height: 46px; transform: translateX(-50%); border-radius: 99px; background: #05070a; z-index: 5; }
.screen { position: relative; border-radius: 76px; overflow: hidden; background: #0b0d10; }
.screen .img { position: absolute; inset: 0; background-size: 100% 100%; background-repeat: no-repeat; }
.hl { position: absolute; left: 3%; right: 3%; border-radius: 30px; border: 3px solid #3dd68c; box-shadow: 0 0 70px rgba(61,214,140,.55), inset 0 0 40px rgba(61,214,140,.18); }
.sub { font-weight: 750; line-height: 1.16; letter-spacing: -0.035em; }
.sub .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.g { color: #3dd68c; } .b { color: #ff8a8e; }
.dot { width: 18px; height: 18px; border-radius: 99px; background: rgba(255,255,255,.18); }
.pill { display: inline-flex; align-items: center; gap: 22px; border-radius: 99px; font-weight: 800; color: #0b0d10; background: linear-gradient(180deg, #5ef0a8, #3dd68c); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 30px 100px -10px rgba(61,214,140,.7); text-align: center; line-height: 1.12; }
.chip { border-radius: 99px; padding: 22px 38px; font-weight: 700; font-size: 44px; background: rgba(18,24,32,.82); border: 1.5px solid rgba(255,255,255,.18); backdrop-filter: blur(14px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.85); white-space: nowrap; }
.tile { border-radius: 30px; overflow: hidden; border: 1.5px solid rgba(255,255,255,.14); background-color: #0b0d10; background-repeat: no-repeat; box-shadow: 0 40px 90px -20px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const V = (Q.get("o") || "v") === "v";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, DUR = 62.6;
const URL_SITE = Q.get("url") || "joaofinance.vercel.app";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, io: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), back: (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const lerp = (a, b, k) => a + (b - a) * k;
const vis = (t, a, b, fi = .4, fo = .4) => E.io(P(t, a, a + fi)) * (1 - E.io(P(t, b - fo, b)));
const stage = document.getElementById("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
const el = (cls, css = {}, parent = stage, html = "") => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); d.innerHTML = html; parent.appendChild(d); return d; };
const A = (n) => `assets/${n}.webp`, S = (n) => `../video/assets/${n}.webp`;

// ───────── layout ─────────
const Lc = V ? { cardX: 40, cardY: 280, cardW: 1000, subX: 70, subY: 1290, subW: 940, subH: 520, subSize: 66, align: "center", phoneX: 540, phoneY: 790, phoneS: .62, dotsY: 100, dotsX: 540 }
             : { cardX: 56, cardY: 76, cardW: 1050, subX: 1170, subY: 200, subW: 690, subH: 680, subSize: 58, align: "left", phoneX: 580, phoneY: 520, phoneS: .56, dotsY: 56, dotsX: 1170 };
const cardH = Lc.cardW * 333 / 376;

// fundo com tom por cena
const bg = { a: el("abs glow", { width: W * .95 + "px", height: W * .95 + "px", background: "radial-gradient(closest-side, rgba(255,170,70,.5), transparent)" }),
             r: el("abs glow", { width: W * .95 + "px", height: W * .95 + "px", background: "radial-gradient(closest-side, rgba(255,80,95,.5), transparent)" }),
             v: el("abs glow", { width: W * .95 + "px", height: W * .95 + "px", background: "radial-gradient(closest-side, rgba(139,132,255,.55), transparent)" }),
             g: el("abs glow", { width: W * .8 + "px", height: W * .8 + "px", background: "radial-gradient(closest-side, rgba(61,214,140,.45), transparent)" }) };
const tone = (t) => ({ warm: vis(t, 0, 8.7, .01, .9), bad: vis(t, 8.4, 20.3, .8, .8), app: vis(t, 20.0, 49.8, .8, .8), end: vis(t, 49.4, 99, .9, .01) });

// ───────── cenas de arte (storyboard) ─────────
function artScene(img, a, b, kb) {
  const box = el("abs card", { left: Lc.cardX + "px", top: Lc.cardY + "px", width: Lc.cardW + "px", height: cardH + "px", opacity: 0 });
  const ph = el("ph", { width: Lc.cardW + "px", height: cardH + "px", backgroundImage: `url(${A(img)})` }, box);
  const sheen = el("abs", { inset: 0, background: "linear-gradient(115deg, rgba(255,255,255,.12), transparent 38%)", pointerEvents: "none" }, box);
  const shade = el("abs", { inset: 0, background: "radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.45))", pointerEvents: "none" }, box);
  return { box, ph, a, b, kb, kind: "art", shade };
}
const scenes = [
  artScene("p1", 0, 4.15, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p2", 4.15, 8.55, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p3", 8.55, 13.65, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p4", 13.65, 20.1, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p5", 20.1, 24.55, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p10", 40.95, 49.6, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
  artScene("p12", 54.15, 58.45, { s: [1.045, 1.1], x: [-8, 8], y: [0, 0] }),
];

// ───────── celular (cenas do aplicativo real) ─────────
const PH = { w: 600, h: 1344, bez: 18 };
const phone = el("abs phone", { width: PH.w + PH.bez * 2 + "px", height: PH.h + PH.bez * 2 + "px", left: "-9999px", top: 0, opacity: 0 });
const screen = el("screen", { width: PH.w + "px", height: PH.h + "px" }, phone);
const screens = {}; [["inicio", S("inicio")], ["movimentacoes", S("movimentacoes")], ["gastei", A("gastei")], ["relatorio", A("relatorio")], ["metas", S("metas")]].forEach(([k, u]) => { screens[k] = el("img", { backgroundImage: `url(${u})`, opacity: 0 }, screen); });
const hl = el("hl", { opacity: 0 }, screen);
const ripple = el("abs", { width: "120px", height: "120px", borderRadius: "50%", border: "5px solid #fff", opacity: 0, marginLeft: "-60px", marginTop: "-60px" }, screen);
const phoneGlow = el("abs glow", { width: "1000px", height: "1000px", background: "radial-gradient(closest-side, rgba(139,132,255,.5), transparent)", opacity: 0 });
const seg = (t, a, b) => E.io(P(t, a, a + .4)) * (1 - E.io(P(t, b - .4, b)));
// [tela, inicio, fim]
const PHONE_SCREENS = [["inicio", 24.55, 27.3], ["movimentacoes", 27.1, 30.55], ["gastei", 30.5, 33.05], ["relatorio", 33.0, 37.6], ["metas", 37.55, 40.95]];
// realces: [inicio, fim, y0%, y1%]
const HLS = [[25.0, 27.1, 80.5, 94.5], [27.5, 30.2, 29, 38], [31.0, 32.0, 54, 60.5], [33.5, 37.2, 3.5, 44], [38.0, 40.6, 34, 62]];

// ───────── textos e legendas (narração) ─────────
const SUBS = [
  [0.0, 3.74, "Você trabalha, se dedica e corre atrás dos *seus sonhos*..."],
  [4.27, 7.95, "Recebe seu dinheiro e planeja gastar com aquilo que *realmente importa*."],
  [8.62, 9.61, "Mas o mês passa..."],
  [10.09, 13.12, "E quando você percebe, não sabe ~para onde o dinheiro foi~."],
  [13.71, 16.74, "Contas, boletos, compras, assinaturas..."],
  [17.29, 19.66, "Tudo se mistura e fica ~difícil de controlar~."],
  [20.30, 24.27, "Foi por isso que eu criei um *aplicativo* para facilitar o controle das suas finanças."],
  [24.67, 30.08, "Em um só lugar, você acompanha suas *receitas, despesas e saldo* de forma simples e visual."],
  [30.58, 32.64, "Registre suas despesas *em segundos*."],
  [33.06, 37.17, "Visualize seus gastos *por categoria* e descubra para onde seu dinheiro está indo."],
  [37.63, 40.59, "Acompanhe seus *objetivos* e evolua mês a mês."],
  [40.99, 44.37, "Tudo isso com uma interface *moderna, simples e fácil de usar*."],
  [44.83, 49.23, "*Agora sim!* Mais controle do meu dinheiro e mais tranquilidade para o futuro."],
  [49.67, 53.85, "Experimente por *24 horas grátis* e conheça todas as funcionalidades."],
  [54.24, 58.04, "Organize suas finanças hoje e construa um amanhã com *mais liberdade*."],
  [58.49, 61.15, "Comece seu *teste grátis* por 24 horas!"],
].map(([a, b, text]) => {
  const box = el("abs sub", { left: Lc.subX + "px", top: Lc.subY + "px", width: Lc.subW + "px", height: Lc.subH + "px", fontSize: Lc.subSize + "px", textAlign: Lc.align, display: "flex", flexDirection: "column", justifyContent: V ? "flex-start" : "center", opacity: 0 });
  const line = document.createElement("div"); box.appendChild(line);
  const words = []; let cls = "";
  text.split(" ").forEach((raw) => {
    let w = raw, c = "";
    const open = /^[*~]/.test(w) ? w[0] : null; if (open) cls = open === "*" ? "g" : "b";
    const close = /[*~][.,!?…]*$/.test(w);
    w = w.replace(/[*~]/g, ""); c = cls;
    if (close) cls = "";
    const s = document.createElement("span"); s.className = "w " + c; s.textContent = w + " "; line.appendChild(s);
    words.push({ s, len: w.length + 1 + (/[,.!?…]$/.test(w) ? 2.2 : 0) });
  });
  const tot = words.reduce((x, w) => x + w.len, 0); let acc = 0;
  words.forEach((w) => { w.t0 = a + (acc / tot) * (b - a) * .92; acc += w.len; });
  return { a, b, box, words };
});

// progresso da história (12 quadros)
const dots = Array.from({ length: 12 }, (_, i) => el("abs dot", { left: Lc.dotsX + (V ? (i - 5.5) * 44 - 9 : i * 40) + "px", top: Lc.dotsY + "px" }));
const dotAt = [0, 4.15, 8.55, 13.65, 20.1, 24.55, 30.5, 33.0, 37.55, 40.95, 49.6, 54.15];

// ───────── cena “24 horas” ─────────
const trial = el("abs", { inset: 0, opacity: 0 });
const ringSize = V ? 560 : 520;
const ring = el("abs", { width: ringSize + "px", height: ringSize + "px", left: (V ? W / 2 - ringSize / 2 : 400 - ringSize / 2 + 60) + "px", top: (V ? 330 : H / 2 - ringSize / 2 - 40) + "px" }, trial,
  `<svg width="${ringSize}" height="${ringSize}" viewBox="0 0 200 200"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef0a8"/><stop offset="1" stop-color="#8b84ff"/></linearGradient></defs>
   <circle cx="100" cy="100" r="86" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="6"/>
   <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="540.4" stroke-dashoffset="540.4" transform="rotate(-90 100 100)"/>
   <g id="ticks"></g><line id="hand" x1="100" y1="100" x2="100" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round" transform="rotate(0 100 100)"/><circle cx="100" cy="100" r="8" fill="#fff"/></svg>`);
const trialBig = el("abs", { left: 0, width: (V ? W : 800) + "px", textAlign: "center", fontWeight: 850, fontSize: V ? "150px" : "130px", letterSpacing: "-0.05em", top: (V ? 880 : H / 2 - 40) + "px", opacity: 0, lineHeight: 1 }, trial, `24<span style="color:#5ef0a8">h</span>`);
const fan = ["cartoes", "dividas", "metas", "investimentos", "orcamentos"].map((n, i) => el("abs tile", { width: (V ? 270 : 250) + "px", height: (V ? 270 : 250) * 1344 / 600 * .52 + "px", backgroundImage: `url(${S(n)})`, backgroundSize: "100% auto", backgroundPosition: "0 -24%", opacity: 0 }, trial));

// ───────── final ─────────
const end = el("abs", { inset: 0, opacity: 0 });
const logoHTML = (size) => `<span style="display:inline-flex;align-items:center;gap:${size * .28}px;font-weight:800;letter-spacing:-.045em;font-size:${size}px;line-height:1"><svg width="${size * .95}" height="${size * .95}" viewBox="0 0 512 512"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a09aff"/><stop offset="1" stop-color="#3dd68c"/></linearGradient></defs><rect x="9" y="9" width="494" height="494" rx="120" fill="#10151c" stroke="url(#lg)" stroke-width="14"/><path d="M148 350l108-190 108 190" fill="none" stroke="url(#lg)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Saldo<span style="background:linear-gradient(100deg,#a09aff,#3dd68c);-webkit-background-clip:text;background-clip:text;color:transparent">UP</span></span></span>`;
const endLogo = el("abs", { left: 0, width: W + "px", textAlign: "center", top: (V ? 520 : 250) + "px", opacity: 0 }, end, logoHTML(V ? 150 : 150));
const endCta = el("abs pill", { fontSize: V ? "62px" : "58px", padding: V ? "44px 74px" : "40px 70px", opacity: 0 }, end, `Comece seu teste grátis<br>por 24 horas <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-8px"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`);
const endUrl = el("abs", { left: 0, width: W + "px", textAlign: "center", fontSize: "50px", fontWeight: 650, color: "#c9c5ff", opacity: 0, top: (V ? 1180 : 760) + "px" }, end, URL_SITE);
const endNote = el("abs", { left: 0, width: W + "px", textAlign: "center", fontSize: "24px", color: "#7f8b9b", opacity: 0, top: (H - 60) + "px", letterSpacing: 0 }, end, "Telas do aplicativo, com dados fictícios.");
// chips da cena de “Agora sim!” (sobre a arte 10)
const chips = ["Mais controle", "Mais tranquilidade"].map((t) => el("abs chip", { opacity: 0 }, stage, `✓ ${t}`));
const capbg = el("abs", { left: 0, right: 0, bottom: 0, height: (V ? 620 : 0) + "px", background: "linear-gradient(180deg, transparent, rgba(5,7,10,.82) 60%)", pointerEvents: "none" });
const fade = el("abs", { inset: 0, background: "#000", opacity: 0 });

function render(t) {
  // fundo
  const tn = tone(t), br = Math.sin(t * .7);
  bg.a.style.opacity = tn.warm * .9; bg.r.style.opacity = tn.bad * (.8 + .2 * Math.sin(t * 2.4)); bg.v.style.opacity = tn.app * .85; bg.g.style.opacity = Math.max(tn.end, tn.app * .45) * .85;
  bg.a.style.transform = `translate(${W * .05 + 40 * br}px, ${-W * .2}px)`; bg.r.style.transform = `translate(${W * .1 - 50 * br}px, ${H * .2}px)`;
  bg.v.style.transform = `translate(${W * .25 + 60 * br}px, ${-W * .1}px)`; bg.g.style.transform = `translate(${-W * .1 + 40 * br}px, ${H * .62}px)`;

  // cenas de arte
  scenes.forEach((s) => {
    const inn = E.io(P(t, s.a, s.a + .6)), out = E.io(P(t, s.b - .5, s.b + .05));
    const on = t >= s.a - .02 && t <= s.b + .1;
    s.box.style.opacity = on ? inn * (1 - out) : 0;
    if (!on) return;
    const k = P(t, s.a, s.b), kb = s.kb;
    const sc = lerp(kb.s[0], kb.s[1], E.io(k)), x = lerp(kb.x[0], kb.x[1], k), y = lerp(kb.y[0], kb.y[1], k);
    s.ph.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
    const slide = (1 - inn) * (V ? 120 : 160) - out * (V ? 90 : 120);
    s.box.style.transform = V ? `translateY(${slide}px) rotate(${(1 - inn) * 1.4 - out * .8}deg) scale(${lerp(.94, 1, inn)})` : `translateX(${slide}px) rotate(${(1 - inn) * 1.1}deg) scale(${lerp(.95, 1, inn)})`;
    s.box.style.filter = t < s.a + .5 ? `blur(${(1 - inn) * 8}px)` : "none";
    if (s.kb.bad) s.ph.style.filter = "saturate(.7)";
  });
  // 3 e 4: clima pesado (menos cor)
  scenes[2].ph.style.filter = `saturate(${lerp(1, .55, P(t, 9.6, 12.8))}) contrast(1.05)`;
  scenes[3].ph.style.filter = `saturate(.75)`;
  scenes[3].box.style.marginLeft = (P(t, 17.3, 19.6) * Math.sin(t * 60) * 5) + "px";   // tremor leve em “fica difícil de controlar”

  // celular
  const pOn = vis(t, 24.55, 40.95, .6, .6);
  const slide = (1 - E.out(P(t, 24.55, 25.3))) * 240 + E.in(P(t, 40.4, 40.95)) * 160;
  phone.style.opacity = pOn;
  phone.style.left = (Lc.phoneX - (PH.w + PH.bez * 2) / 2 + (V ? 0 : -slide)) + "px"; phone.style.top = (Lc.phoneY - (PH.h + PH.bez * 2) / 2 + (V ? slide : 0)) + "px";
  const ry = (V ? 0 : 8) + Math.sin(t * .8) * 3, rx = Math.sin(t * .6) * 2;
  phone.style.transform = `perspective(2600px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${Lc.phoneS * (1 + .03 * Math.sin(t * .5))})`;
  phoneGlow.style.opacity = pOn * .9; phoneGlow.style.left = (Lc.phoneX - 500) + "px"; phoneGlow.style.top = (Lc.phoneY - 500) + "px";
  const wv = { inicio: 0, movimentacoes: 0, gastei: 0, relatorio: 0, metas: 0 };
  PHONE_SCREENS.forEach(([n, a, b], i) => { wv[n] = (i === 0 ? 1 : E.io(P(t, a, a + .4))) * (i === PHONE_SCREENS.length - 1 ? 1 : 1 - E.io(P(t, b - .3, b + .1))); if (i === 0) wv[n] = 1 - E.io(P(t, b - .3, b + .1)); });
  Object.keys(screens).forEach((k) => { screens[k].style.opacity = wv[k]; });
  let ho = 0, y0 = 0, y1 = 0;
  HLS.forEach(([a, b, h0, h1]) => { const k = E.io(P(t, a, a + .35)) * (1 - E.io(P(t, b - .3, b))); if (k > ho) { ho = k; y0 = h0; y1 = h1; } });
  hl.style.opacity = ho; hl.style.top = y0 + "%"; hl.style.height = (y1 - y0) + "%";
  const rk = P(t, 32.0, 32.7);
  ripple.style.opacity = rk > 0 && rk < 1 ? (1 - rk) * .9 : 0; ripple.style.left = "50%"; ripple.style.top = "94.5%"; ripple.style.transform = `scale(${lerp(.3, 2.4, E.out(rk))})`;

  // legendas
  SUBS.forEach((c) => {
    const o = t >= c.a - .1 && t <= c.b + .5 ? E.io(P(t, c.a - .1, c.a + .12)) * (1 - E.io(P(t, c.b + .15, c.b + .5))) : 0;
    c.box.style.opacity = o;
    if (o > 0) c.words.forEach((w) => { const p = E.out(P(t, w.t0, w.t0 + .3)); w.s.style.opacity = p; w.s.style.transform = `translateY(${(1 - p) * 38}px)`; w.s.style.filter = `blur(${(1 - p) * 10}px)`; });
  });
  // sobreposições
  const subHide = t > 58.4 ? 0 : 1; // no encerramento o CTA assume
  SUBS[15].box.style.opacity = SUBS[15].box.style.opacity * 0;
  // pontos de progresso
